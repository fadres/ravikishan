# Netlify Configuration for Ravikishan Frontend
# Deploy to: https://your-app.netlify.app

# Build settings
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Environment variables (set in Netlify dashboard)
VITE_API_URL=https://hero000001.netlify.app

# Headers for SPA routing and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:;"

# Specific headers for static assets
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

# API proxy to Render backend (if needed)
[[redirects]]
  from = "/api/*"
  to = "https://your-backend-render-url.com/api/:splat"
  status = 200
  force = true
  headers = { "X-Forwarded-Host" = "your-backend-render-url.com" }

# Service Worker cache strategy
[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200
  force = true