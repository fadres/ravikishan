# Netlify build settings for the Ravikishan SPA.
# Set the build-time env var VITE_API_URL in Netlify → Site settings →
# Environment variables (e.g. https://ravikishan-api.onrender.com).
# The SPA fallback also ships as frontend/public/_redirects (/* → /index.html).

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
