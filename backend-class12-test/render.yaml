# Render blueprint for an independent section backend (template for every
# future section). Deploy as its OWN Render service — never merge this into
# the global ravikishan-api service.
#
# Required secrets (set in the Render dashboard, not here):
#   DATABASE_URL           its OWN brand-new Neon project
#   JWT_ACCESS_SECRET      IDENTICAL to the global backend's value
#   PROGRESS_SYNC_SECRET   IDENTICAL to the global backend's value
#   PROGRESS_SYNC_URL      the GLOBAL backend's public base URL
#   AI_ENDPOINT / AI_API_KEY / AI_MODEL   (optional, offline-first otherwise)

services:
  - type: web
    name: ravikishan-class12-test-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push --skip-generate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4100"
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: PROGRESS_SYNC_SECRET
        sync: false
      - key: PROGRESS_SYNC_URL
        sync: false
      - key: CORS_ALLOWED_ORIGIN
        sync: false
      - key: SECTION_ID
        value: class-12-test
      - key: SECTION_LABEL
        value: Class 12
      - key: SECTION_CLASS_SLUG
        value: class-12
      - key: SECTION_CONTENT_DIR
        value: content/class-12-test
      - key: AI_ENDPOINT
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
