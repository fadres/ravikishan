# Render blueprint for the Ravikishan backend web service.
# Create the free PostgreSQL database separately on Neon or Supabase and
# paste its connection string as DATABASE_URL (see docs/README.md).

services:
  - type: web
    name: ravikishan-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: OWNER_EMAIL
        value: harindarsah98172@gmail.com
      - key: OWNER_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SITE_URL
        value: https://timepass001.netlify.app
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
