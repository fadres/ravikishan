# Nginx Site Configuration - Ravikishan Frontend
# This file should be placed in /etc/nginx/sites-available/ravikishan

server {
    # Listen on HTTP and HTTPS
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Redirect HTTP to HTTPS (if HTTPS is configured)
    # return 301 https://$host$request_uri;

    # Frontend files root
    root /var/www/ravikishan-frontend/dist;
    index index.html;

    # Static assets cache settings
    location ~* ^.+(\.(js|css|json|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot|ico|html))$ {
        # Cache for 1 year for hashed files
        expires 365d;
        add_header Cache-Control "public, immutable";
        # Help browser cache identification
        add_header ETag "$etag";
        # Cache control for long-term
        add_header Last-Modified "$date_gmt";
        # Enable gzip compression
        gzip on;
        gzip_vary on;
        gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_http_version 1.1;
        gzip_min_length 1000;
        # Compress responses
        gzip;
        # Disable compression for small responses
        gzip_disable "msie6";
        # Cache control for hashed files
        if ($request_filename ~* "\.(js|css|json|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot|ico|html)$") {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # Never cache index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # React SPA routes - all non-API routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
        # Cache control for HTML
        add_header Cache-Control "public, max-age=0, must-revalidate";
        # Enable gzip
        gzip on;
        gzip_vary on;
        gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_http_version 1.1;
        gzip_min_length 1000;
    }

    # API proxy to backend
    location /api/ {
        # Proxy to Express backend
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;

        # Cache control for API
        add_header Cache-Control "no-store";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:4000;";
    add_header Permissions-Policy "geolocation=(), microphone=()";

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Gzip compression settings
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_http_version 1.1;
    gzip_min_length 1000;
    gzip_disable "msie6";
    # Enable compression for all responses
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

    # Static file caching with ETags
    etag on;
    absolute_uri on;

    # Error pages
    error_page 404 /404.html;
    location = /404.html {
        internal;
        root /var/www/ravikishan-frontend/dist;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        root /var/www/ravikishan-frontend/dist;
    }
}